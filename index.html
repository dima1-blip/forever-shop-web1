<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Forever Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <div class="logo">Forever</div>
        <div class="subtitle">Apple Store</div>
    </div>

    <button class="cart-button" onclick="openCart()">
        🛒 <span id="cartCount">0</span>
    </button>
</header>


<section class="hero">
    <div class="hero-text">
        <span>FOREVER SHOP</span>
        <h1>Техника Apple<br>в одном месте.</h1>
        <p>iPhone, MacBook, AirPods и Apple Watch.</p>
    </div>
</section>


<div class="categories">
    <button class="category active" onclick="filterProducts('all', this)">
        Все
    </button>

    <button class="category" onclick="filterProducts('iphone', this)">
        iPhone
    </button>

    <button class="category" onclick="filterProducts('mac', this)">
        Mac
    </button>

    <button class="category" onclick="filterProducts('airpods', this)">
        AirPods
    </button>

    <button class="category" onclick="filterProducts('watch', this)">
        Watch
    </button>
</div>


<main>
    <h2>Популярные товары</h2>

    <div id="products" class="products"></div>
</main>


<div id="cartModal" class="modal hidden">
    <div class="modal-content">

        <div class="modal-header">
            <h2>Корзина</h2>

            <button onclick="closeCart()">✕</button>
        </div>

        <div id="cartItems"></div>

        <div class="total">
            <span>Итого:</span>
            <strong id="cartTotal">0 €</strong>
        </div>

        <button class="checkout" onclick="checkout()">
            Оформить заказ
        </button>

    </div>
</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>

</body>
</html>
